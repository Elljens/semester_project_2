<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoingOnce - My profile</title>
    <script
      src="https://kit.fontawesome.com/ec3d7ec6ab.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./editProfile.js"></script>
  </head>
  <body>
    <header class="h-30 bg-gray-300 p-10">
      <nav class="flex items-center justify-between">
        <div>
          <a href="../index.html"
            ><img src="../public/Logo.png" alt="logo" class="h-15"
          /></a>
        </div>
        <div class="flex gap-6">
          <a href="../auth/register.html" class="font-heading text-l"
            ><i class="fa-solid fa-user-plus fa-lg text-brand pr-1"></i
            >Register</a
          >
          <a href="../auth/login.html" class="font-heading text-l"
            ><i class="fa-solid fa-user fa-lg text-brand pr-1"></i>Log in</a
          >
        </div>
      </nav>
    </header>
    <main class="bg-accent min-h-screen">
      <h1 class="font-heading pt-15 pb-5 text-center text-3xl font-medium">
        Edit Profile
      </h1>
      <form id="edit-profile-form" class="mx-auto flex max-w-md flex-col p-10">
        <p
          id="formError"
          class="my-2 hidden rounded border border-red-700 bg-red-100 p-3 text-red-700"
        ></p>
        <p
          id="formSuccess"
          class="my-2 hidden rounded border border-green-700 bg-green-100 p-3 text-green-700"
        ></p>

        <div class="flex flex-col">
          <label for="bio">Bio</label>
          <textarea
            id="bio"
            name="bio"
            maxlength="159"
            class="mb-2 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          ></textarea>
          <p id="bioError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="avatar-url">Avatar URL</label>
          <input
            id="avatar-url"
            name="avatar-url"
            type="url"
            class="mb-2 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p id="avatarUrlError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="avatar-alt">Avatar Description</label>
          <textarea
            id="avatar-alt"
            name="avatar-alt"
            type="text"
            maxlength="119"
            class="mb-2 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          ></textarea>
          <p id="avatarAltError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="banner-url">Banner URL</label>
          <input
            id="banner-url"
            name="banner-url"
            type="url"
            class="mb-2 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p id="bannerUrlError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="banner-alt">Banner Description</label>
          <textarea
            id="banner-alt"
            name="banner-alt"
            type="text"
            maxlength="119"
            class="mb-2 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          ></textarea>
          <p id="bannerAltError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <button
          id="submit"
          type="submit"
          class="bg-brand font-heading mt-7 h-12 rounded-sm text-center font-medium text-white shadow-lg"
        >
          Update Profile
        </button>
      </form>
    </main>
  </body>
</html>
