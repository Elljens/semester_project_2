<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://kit.fontawesome.com/ec3d7ec6ab.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./register.js"></script>
  </head>
  <body>
    <header class="h-30 bg-gray-300 p-10">
      <nav class="flex items-center justify-between">
        <div>
          <a href="../index.html"
            ><img src="../public/Logo.png" alt="logo" class="h-15"
          /></a>
        </div>
        <div class="flex gap-6">
          <a href="register.html" class="text-l font-heading font-medium"
            ><i class="fa-solid fa-user-plus fa-lg text-brand pr-1"></i
            >Register</a
          >
          <a href="./login.html" class="text-l font-heading font-medium"
            ><i class="fa-solid fa-user fa-lg text-brand pr-1"></i>Log in</a
          >
        </div>
      </nav>
    </header>
    <main class="bg-accent min-h-screen">
      <h1 class="font-heading pt-15 pb-5 text-center text-3xl font-medium">
        Create a new account
      </h1>
      <form id="register-form" class="mx-auto flex max-w-md flex-col p-10">
        <p
          id="formError"
          class="my-2 hidden rounded border border-red-700 bg-red-100 p-3 text-red-700"
        ></p>
        <p
          id="formSuccess"
          class="my-2 hidden rounded border border-green-700 bg-green-100 p-3 text-green-700"
        ></p>
        <div class="flex flex-col">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            minlength="1"
            class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="mb-2 text-sm text-gray-500">
            Letters, numbers and underscore only
          </p>
          <p id="nameError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="example@stud.noroff.no"
            class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="mb-2 text-sm text-gray-500">Must be a stud.noroff email</p>
          <p id="emailError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="mb-2 text-sm text-gray-500">
            Must be at least 8 characters
          </p>
          <p id="passwordError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <button
          id="submit"
          type="submit"
          class="bg-brand font-heading mt-7 h-12 rounded-sm text-center font-medium text-white shadow-lg"
        >
          Register
        </button>
      </form>
    </main>
  </body>
</html>
