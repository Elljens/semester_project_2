<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoingOnce - Register</title>
    <script
      src="https://kit.fontawesome.com/ec3d7ec6ab.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./register.js"></script>
    <script type="module" src="../service/header.js"></script>
  </head>
  <body>
    <header
      class="sticky top-0 z-30 h-30 items-center bg-gray-200 p-10 px-5 shadow-sm"
    >
      <div class="flex items-center justify-between">
        <div>
          <a href="../index.html"
            ><img src="../public/Logo.png" alt="logo" class="h-10 sm:h-12"
          /></a>
        </div>
        <nav id="logged-out-nav" class="flex hidden gap-2">
          <a href="./register.html" class="text-md font-medium"
            ><i class="fa-solid fa-user-plus text-brand p-1"></i>Register</a
          >
          <a href="./login.html" class="text-md font-medium"
            ><i class="fa-solid fa-user text-brand p-1"></i>Log in</a
          >
        </nav>
        <nav id="logged-in-nav" class="flex items-center">
          <div class="pr-3 text-right">
            <p id="header-name" class="font-heading font-regular"></p>
            <p id="header-credit" class="font-heading font-medium"></p>
          </div>
          <div class="relative">
            <button
              id="avatar-button"
              type="button"
              aria-label="open user menu"
              aria-expanded="false"
              class="block rounded-full"
            >
              <img
                id="header-avatar"
                src="../public/no_image.png"
                alt="user-avatar"
                class="h-15 w-15 rounded-full object-cover"
              />
            </button>
          </div>
          <div
            id="user-menu"
            class="bg-accent absolute right-3 z-50 mt-40 hidden rounded-md py-2 shadow-md"
          >
            <a href="./profile/myProfile.html" class="block px-4 py-2"
              >My profile</a
            >
            <button
              id="logout-button"
              type="button"
              class="block w-full px-4 py-2 text-left"
            >
              Log out
            </button>
          </div>
        </nav>
      </div>
    </header>
    <main class="bg-accent min-h-screen">
      <h1 class="font-heading pt-15 pb-5 text-center text-3xl font-medium">
        Create a new account
      </h1>
      <form id="register-form" class="mx-auto flex max-w-md flex-col p-10">
        <p
          id="formError"
          class="my-2 hidden rounded border border-red-700 bg-red-100 p-3 text-red-700"
        ></p>
        <p
          id="formSuccess"
          class="my-2 hidden rounded border border-green-700 bg-green-100 p-3 text-green-700"
        ></p>
        <div class="flex flex-col">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            minlength="1"
            class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="mb-2 text-sm text-gray-500">
            Letters, numbers and underscore only
          </p>
          <p id="nameError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="example@stud.noroff.no"
            class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="mb-2 text-sm text-gray-500">Must be a stud.noroff email</p>
          <p id="emailError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <div class="flex flex-col">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            class="h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="mb-2 text-sm text-gray-500">
            Must be at least 8 characters
          </p>
          <p id="passwordError" class="mb-1 hidden text-sm text-red-600"></p>
        </div>

        <button
          id="submit"
          type="submit"
          class="bg-brand font-heading mt-7 h-12 rounded-sm text-center font-medium text-white shadow-lg"
        >
          Register
        </button>
      </form>
    </main>
  </body>
</html>
