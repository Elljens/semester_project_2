<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoingOnce Online Auctions</title>
    <script
      src="https://kit.fontawesome.com/ec3d7ec6ab.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="./details.js"></script>
    <script type="module" src="../service/header.js"></script>
  </head>
  <body>
    <header
      class="sticky top-0 z-30 h-30 items-center bg-gray-200 p-10 px-5 shadow-sm"
    >
      <div class="flex items-center justify-between">
        <div>
          <a href="../index.html"
            ><img src="../public/Logo.png" alt="logo" class="h-10 sm:h-12"
          /></a>
        </div>
        <nav id="logged-out-nav" class="flex hidden gap-2">
          <a href="../auth/register.html" class="text-md font-medium"
            ><i class="fa-solid fa-user-plus"></i>Register</a
          >
          <a href="../auth/login.html" class="text-md font-medium"
            ><i class="fa-solid fa-user"></i>Log in</a
          >
        </nav>
        <nav id="logged-in-nav" class="flex items-center">
          <div class="pr-3 text-right">
            <p id="header-name" class="font-heading font-regular"></p>
            <p id="header-credit" class="font-heading font-medium"></p>
          </div>
          <div class="relative">
            <button
              id="avatar-button"
              type="button"
              aria-label="open user menu"
              aria-expanded="false"
              class="block rounded-full"
            >
              <img
                id="header-avatar"
                src="../public/no_image.png"
                alt="user-avatar"
                class="h-15 w-15 rounded-full object-cover"
              />
            </button>
          </div>
          <div
            id="user-menu"
            class="bg-accent absolute right-3 z-50 mt-40 hidden rounded-md py-2 shadow-md"
          >
            <a href="../profile/myProfile.html" class="block px-4 py-2"
              >My profile</a
            >
            <button
              id="logout-button"
              type="button"
              class="block w-full px-4 py-2 text-left"
            >
              Log out
            </button>
          </div>
        </nav>
      </div>
    </header>
    <main class="bg-accent mx-auto min-h-screen pb-20">
      <div
        id="listing-container"
        class="mx-auto flex w-full max-w-2xl justify-center p-10"
      >
        <div
          id="card"
          class="flex flex-col justify-center bg-white pb-10 shadow-md"
        ></div>
      </div>
      <a
        href="../index.html"
        class="bg-brand font-heading text-md mx-auto flex w-40 justify-center rounded-sm p-3 font-medium text-white shadow-md"
      >
        Back to listings</a
      >
    </main>
  </body>
</html>
