<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoingOnce - New Listing</title>
    <script
      src="https://kit.fontawesome.com/ec3d7ec6ab.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="./newListing.js"></script>
    <script type="module" src="../service/header.js"></script>
  </head>
  <body>
    <header
      class="sticky top-0 z-30 h-30 items-center bg-gray-200 p-10 px-5 shadow-sm"
    >
      <div class="flex items-center justify-between">
        <div>
          <a href="../index.html"
            ><img src="../public/Logo.png" alt="logo" class="h-10 sm:h-12"
          /></a>
        </div>
        <nav id="logged-out-nav" class="flex hidden gap-2">
          <a href="../auth/register.html" class="text-md font-medium"
            ><i class="fa-solid fa-user-plus"></i>Register</a
          >
          <a href="../auth/login.html" class="text-md font-medium"
            ><i class="fa-solid fa-user"></i>Log in</a
          >
        </nav>
        <nav id="logged-in-nav" class="flex items-center">
          <div class="pr-3 text-right">
            <p id="header-name" class="font-heading font-regular"></p>
            <p id="header-credit" class="font-heading font-medium"></p>
          </div>
          <div class="relative">
            <button
              id="avatar-button"
              type="button"
              aria-label="open user menu"
              aria-expanded="false"
              class="block rounded-full"
            >
              <img
                id="header-avatar"
                src="../public/no_image.png"
                alt="user-avatar"
                class="h-15 w-15 rounded-full object-cover"
              />
            </button>
          </div>
          <div
            id="user-menu"
            class="bg-accent absolute right-3 z-50 mt-40 hidden rounded-md py-2 shadow-md"
          >
            <a href="../profile/myProfile.html" class="block px-4 py-2"
              >My profile</a
            >
            <button
              id="logout-button"
              type="button"
              class="block w-full px-4 py-2 text-left"
            >
              Log out
            </button>
          </div>
        </nav>
      </div>
    </header>
    <main class="bg-accent mx-auto min-h-screen">
      <h1 class="font-heading pt-15 pb-5 text-center text-3xl font-medium">
        Create a new listing
      </h1>
      <form id="create-form" class="mx-auto flex max-w-md flex-col p-10">
        <p
          id="formError"
          class="my-2 hidden rounded border border-red-700 bg-red-100 p-3 text-red-700"
        ></p>
        <p
          id="formSuccess"
          class="my-2 hidden rounded border border-green-700 bg-green-100 p-3 text-green-700"
        ></p>

        <div class="flex flex-col">
          <label for="title">Title *</label>
          <input
            id="title"
            name="title"
            type="text"
            required
            class="mb-3 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
        </div>

        <div class="flex flex-col">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            class="mb-3 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          >
          </textarea>
        </div>

        <div class="flex flex-col">
          <label for="tags">Tags</label>
          <input
            id="tags"
            name="tags"
            type="text"
            placeholder="jewelry, vintage, silver"
            class="mb-3 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
          <p class="text-sm">Seperate tags with commas</p>
        </div>

        <div class="flex flex-col">
          <label for="media-url">Image URL</label>
          <input
            id="media-url"
            name="mediaUrl"
            type="url"
            class="mb-3 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
        </div>

        <div class="flex flex-col">
          <label for="media-alt">Image Description</label>
          <input
            id="media-alt"
            name="mediaAlt"
            type="text"
            class="mb-3 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
        </div>

        <div class="flex flex-col">
          <label for="ends-at">Auction end *</label>
          <input
            id="ends-at"
            name="endsAt"
            type="datetime-local"
            required
            class="mb-8 h-10 rounded-sm border border-gray-300 bg-white p-2 shadow-inner"
          />
        </div>

        <button
          id="submit"
          class="bg-brand font-heading h-12 rounded-sm text-center font-medium text-white shadow-lg"
        >
          Create Listing
        </button>
      </form>
    </main>
  </body>
</html>
